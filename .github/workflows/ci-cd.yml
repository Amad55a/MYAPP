
name: DevOps World CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install the same Node.js major version as your laptop
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Check dependencies for known security vulnerabilities
      - name: Security audit
        run: npm audit --audit-level=high

      # 5. Build the Next.js application
      - name: Build application
        run: npm run build

      # 6. Start the production application and test its health
      - name: Start and test application
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed!"
          cat server.log
          exit 1

      # 7. Prepare the production release
      - name: Package release
        run: |
          mkdir release
          cp -r .next release/
          cp -r public release/
          cp package.json package-lock.json release/

          for file in next.config.*; do
            if [ -f "$file" ]; then
              cp "$file" release/
            fi
          done

          tar -czf release.tar.gz -C release .

      # 8. Upload the release as a downloadable workflow artifact
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-world-release
          path: release.tar.gz
          retention-days: 7
