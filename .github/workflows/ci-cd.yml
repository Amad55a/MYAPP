
name: DevOps World CI Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

      - name: Start and test application
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed!"
          cat server.log
          exit 1

      - name: Package release
        run: |
          mkdir release
          cp -r .next release/

          if [ -d public ]; then
            cp -r public release/
          fi

          cp package.json package-lock.json release/

          for file in next.config.*; do
            if [ -f "$file" ]; then
              cp "$file" release/
            fi
          done

          npm ci --omit=dev --prefix release

          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-world-release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 7

  deploy:
    name: Deploy to the server
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Download the release
        uses: actions/download-artifact@v4
        with:
          name: devops-world-release

      - name: Set up the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Send the release to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          printf '%s\n' "$APP_ENV" | tr -d '\r' > app.env
          tar -cf - release.tar.gz app.env | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "$GITHUB_SHA $(cut -d ' ' -f1 release.sha256)"

      - name: Delete the SSH key and settings
        if: always()
        run: rm -f ~/.ssh/deploy_key app.env
