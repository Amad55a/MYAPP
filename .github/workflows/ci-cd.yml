
name: DevOps World CI Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

      - name: Start and test application
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed!"
          cat server.log
          exit 1

      - name: Package release
        run: |
          mkdir release
          cp -r .next release/

          if [ -d public ]; then
            cp -r public release/
          fi

          cp package.json package-lock.json release/

          for file in next.config.*; do
            if [ -f "$file" ]; then
              cp "$file" release/
            fi
          done

          npm ci --omit=dev --prefix release

          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-world-release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 7
